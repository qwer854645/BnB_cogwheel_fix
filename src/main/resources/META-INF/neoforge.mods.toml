Fixes Create / Northstar / Fantasizing cogwheel textures under Bits 'n' Bobs 2.2+.
When BnB is present, enables a built-in resource pack that retargets cogwheel models onto bits_n_bobs:block/default_cogwheel*.
'''

[[dependencies.bnb_cogwheel_compat]]
